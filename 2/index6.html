<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адрес</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 24px;
            font-size: 2rem;
            color: #222;
        }
        address {
            font-style: normal;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .address-block {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fb;
            border-left: 4px solid #0066cc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Контактная информация</h1>
        <address class="address-block">
            <p>
                Email:
                <a href="mailto:email@mywebsite.ru">
                    email@mywebsite.ru
                </a>
            </p>
            <p>
                г. Москва, ул. Долгоруковская, д. 25
            </p>
        </address>
    </main>
</body>
</html>
