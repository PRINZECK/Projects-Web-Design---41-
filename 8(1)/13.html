<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжный аукцион</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;
        }
        table {
            width: 600px;
        }
        th, td {
            padding: 7px 10px 10px 10px;
        }
        th {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 90%;
            border-bottom: 2px solid #999;
            text-align: left;
        }
        tr.even {
            background-color: #efefef;
        }
        tr:hover {
            background-color: #c3e6e5;
        }
        .money {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Книжный аукцион</h1>
    <table>
        <tr>
            <th>Эдвард Эстлин Каммингс</th>
            <th>Тюльпаны и дымоход</th>
            <th class="money">60000 рублей</th>
            <th class="money">78500 рублей</th>
        </tr>
        <tr>
            <td>Карл I Орлеанский</td>
            <td>Поэмы</td>
            <td class="money"></td>
            <td class="money">162000 рублей</td>
        </tr>
        <tr class="even">
            <td>Томас Стернз Элиот</td>
            <td>Поэмы 1909 - 1925</td>
            <td class="money">32700 рублей</td>
            <td class="money">253500 рублей</td>
        </tr>
        <tr class="even">
            <td>Сильвия Плат</td>
            <td>Колосс</td>
            <td class="money"></td>
            <td class="money">30300 рублей</td>
        </tr>
    </table>
</body>
</html>
