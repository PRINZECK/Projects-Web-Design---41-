<!DOCTYPE html>
<html>
   <head>
     <title>Применение стилей к полям и подписям</title>
   	 <style type="text/css">
		*{
		font-family: Arial, Verdana, sans-serif;
		color: #665544;
		}
	input{
		border-bottom: 1px dotted #dcdcdc;
		border-top: none;
        border-right: none;	
		border-left: none;
		padding: 5px;
		width: 280px;
		margin-bottom: 20px;}
	input:focus{
		border: 1px dotted #dcdcdc;
		outline: none;}
	input#sumbit {
		color: #ffffff;
		background-color: #665544;
		border: none;
		border-radius: 5px;
		width: 80px;}
	input#sumbit:hover{
		color: #665544;
		background-color: #efefef;}
	fieldset {
		width: 350px;
		border: 1px solid #dcdcdc;
		border-radius: 10px;
		padding: 20px;
		text-align: right;}
	legend{
		background-color: #efefef;
		border: 1px solid #dcdcdc;
        border-radius: 10px;		
		padding: 10x 20px;
		text-align: left;
		text-transform: uppercase;}
	</style>
   </head>
<body>
<form>
<fieldset>
<legend>Рассылка</legend>
<label for="name">Имя:</label><input type="text" id="name" />
<label for="email">Email:</label><input type="text" id="email" />
<input type="sumbit" value="Подписка" id="sumbit" />
</fieldset>
</form>
</body>
</html>
