<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Style</title>
    <style type="text/css">
        ol {
            list-style-type: lower-roman;
        }
    </style>
</head>
<body>
    <h1>Поэмы</h1>
    <h2>Поэмы</h2>
    <ol>
        <li>Жизнь</li>
        <li>Природа</li>
        <li>Любовь</li>
        <li>Время и вечность</li>
        <li>Одинокий пёс</li>
    </ol>
</body>
</html>
