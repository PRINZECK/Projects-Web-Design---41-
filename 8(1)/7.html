<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Style</title>
    <style type="text/css">
        ul {
            list-style: url("images/star.png");
        }
        li {
            margin: 10px 0px 0px 0px;
        }
    </style>
</head>
<body>
    <h1>Список перевдённых поэм</h1>
    <h2>Артюр Рембо</h2>
    <ul>
        <li>Офелия</li>
        <li>На музыке</li>
        <li>Зимняя мечта</li>
        <li>Гласные</li>
        <li>Пьяный корбль</li>
    </ul>
</body>
</html>
