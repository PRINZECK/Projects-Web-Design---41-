<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заголовки таблиц</title>
</head>
<body>
    <table>
        <tr>
            <th></th>
            <th scope="col">Суббота</th>
            <th scope="col">Воскресенье</th>
        </tr>
        <tr>
            <th scope="row">Продано билетов</th>
            <td>120</td>
            <td>135</td>
        </tr>
        <tr>
            <th scope="row">Выручка</th>
            <td>18000 руб.</td>
            <td>20250 руб.</td>
        </tr>
    </table>
</body>
</html>
